name: Overlay site

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['site-*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release_commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Check release tag
        id: tag
        if: github.repository == 'thewakingsands/overlays' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/site-')
        run: |
          commit=$(git rev-parse 'HEAD^{commit}')
          git merge-base --is-ancestor "$commit" refs/remotes/origin/master
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Read tool versions
        id: versions
        run: |
          awk '$1 == "nodejs" { print "node=" $2 } $1 == "bun" { print "bun=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}

      - name: Build and package
        env:
          PACKAGE_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/site-') && github.ref_name || '' }}
        run: make package

      - name: Upload site package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: overlay-site
          path: |
            artifacts/overlays-site-*.tar.gz
            artifacts/SHA256SUMS
            artifacts/build-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0

  release:
    needs: build
    if: github.repository == 'thewakingsands/overlays' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/site-') && needs.build.outputs.release_commit != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: overlay-site-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: overlay-site
          path: artifacts

      - name: Publish verified site package
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.build.outputs.release_commit }}
        run: |
          sha256sum --check --strict SHA256SUMS
          [[ "$(jq -r .commit build-manifest.json)" == "$COMMIT" ]]
          remote=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          ref=$(awk '/\^\{\}$/ { print $1; exit }' <<< "$remote")
          [[ -n "$ref" ]] || ref=$(awk 'NR == 1 { print $1 }' <<< "$remote")
          [[ "$ref" == "$COMMIT" ]]
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists for $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "overlays-site-$TAG.tar.gz" SHA256SUMS build-manifest.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
